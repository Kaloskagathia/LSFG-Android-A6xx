name: Build patched LSFG APK

on:
  workflow_dispatch:
  push:
    branches:
      - surfaceflinger-aidl

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Build debug APK
        working-directory: LSFG-Android-Application
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Show generated APKs
        run: |
          find LSFG-Android-Application/app/build/outputs/apk \
            -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-a6xx-surfaceflinger-debug
          path: LSFG-Android-Application/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
